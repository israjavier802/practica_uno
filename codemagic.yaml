workflows:
  ios-workflow:
    name: Compilacion iOS para Sideloadly
    instance_type: mac_mini_m1
    environment:
      node: latest
      xcode: latest
    scripts:
      - name: Instalar dependencias
        script: npm install
      - name: Compilar proyecto web
        script: npm run build
      - name: Sincronizar iOS
        script: npx cap sync ios
      - name: Construir archivo IPA sin firma
        script: |
          cd ios/App
          xcodebuild build -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos SYMROOT=$(PWD)/build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
          mkdir -p build/Payload
          cp -R build/Release-iphoneos/App.app build/Payload/
          cd build
          zip -qr app.ipa Payload
    artifacts:
      - ios/App/build/app.ipa