<ion-header>
  <ion-toolbar color="secondary">
    <!-- Flecha para regresar al login -->
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login" text="Volver"></ion-back-button>
    </ion-buttons>
    <ion-title>Registro</ion-title>
  </ion-toolbar>
</ion-header>
 
<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>
 
  <form (ngSubmit)="guardarDatos()">
    <ion-list>
      <ion-item>
        <ion-input
          label="Nombre completo"
          labelPlacement="floating"
          name="nombre"
          type="text"
          autocomplete="name"
          maxlength="100"
          [(ngModel)]="usuario.nombre">
        </ion-input>
      </ion-item>
 
      <ion-item>
        <ion-input
          label="Matrícula"
          labelPlacement="floating"
          name="matricula"
          type="text"
          autocapitalize="characters"
          maxlength="20"
          [(ngModel)]="usuario.matricula">
        </ion-input>
      </ion-item>
 
      <ion-item>
        <ion-input
          label="Correo"
          labelPlacement="floating"
          name="correo"
          type="email"
          inputmode="email"
          autocomplete="email"
          autocapitalize="off"
          maxlength="100"
          [(ngModel)]="usuario.correo">
        </ion-input>
      </ion-item>
 
      <ion-item>
        <ion-input
          label="Contraseña"
          labelPlacement="floating"
          name="contra"
          [type]="verContra ? 'text' : 'password'"
          autocomplete="new-password"
          autocapitalize="off"
          maxlength="50"
          helperText="Mínimo 6 caracteres"
          [(ngModel)]="usuario.contra">
        </ion-input>
        <ion-button
          slot="end"
          fill="clear"
          type="button"
          [attr.aria-label]="verContra ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          (click)="verContra = !verContra">
          <ion-icon slot="icon-only" [name]="verContra ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
        </ion-button>
      </ion-item>
 
      <ion-item>
        <ion-input
          label="Confirmar contraseña"
          labelPlacement="floating"
          name="confirmar"
          [type]="verContra ? 'text' : 'password'"
          autocomplete="new-password"
          autocapitalize="off"
          maxlength="50"
          [(ngModel)]="confirmarContra">
        </ion-input>
      </ion-item>
    </ion-list>
 
    <p *ngIf="mensajeError" role="alert" style="color: var(--ion-color-danger);">
      {{ mensajeError }}
    </p>
 
    <ion-button
      expand="block"
      type="submit"
      class="ion-margin-top"
      [disabled]="guardando">
      <ion-spinner *ngIf="guardando" name="crescent" style="width:18px;height:18px;margin-right:8px;"></ion-spinner>
      <span>{{ guardando ? 'Guardando...' : 'Registrarme' }}</span>
    </ion-button>
 
    <div style="text-align:center; margin-top:12px; font-size:0.9rem;">
      <span>¿Ya tienes cuenta?</span>
      <ion-button fill="clear" size="small" type="button" (click)="irALogin()">
        Inicia sesión
      </ion-button>
    </div>
  </form>
</ion-content>
