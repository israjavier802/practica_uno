<ion-header>
  <ion-toolbar color="secondary">
    <ion-button href="/home" size="small">Inicio</ion-button>
    <ion-title>Registro de Alumnos</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <h2>Ingresa tus datos</h2>

  <ion-list>
    <ion-item>
      <ion-input
        label="Nombre completo"
        labelPlacement="floating"
        [(ngModel)]="usuario.nombre"
        type="text"
        maxlength="100"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Matrícula"
        labelPlacement="floating"
        [(ngModel)]="usuario.matricula"
        type="text"
        maxlength="20"
        required>
      </ion-input>
    </ion-item>

    <ion-item>
      <ion-input
        label="Correo"
        labelPlacement="floating"
        [(ngModel)]="usuario.correo"
        type="email"
        maxlength="100"
        required>
      </ion-input>
    </ion-item>
  </ion-list>

  <p *ngIf="mensajeError" role="alert" style="color: red;">
    {{ mensajeError }}
  </p>

  <ion-button
    expand="block"
    class="ion-margin-top"
    (click)="guardarDatos()"
    [disabled]="guardando">
    {{ guardando ? 'Guardando...' : 'Guardar' }}
  </ion-button>
</ion-content>
