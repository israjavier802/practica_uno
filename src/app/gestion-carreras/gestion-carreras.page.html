<ion-header>
  <ion-toolbar>
   <ion-title>
    Gestion de Carreras
    </ion-title>

    <ion-button size="small" href="/home">
      Inicio
    </ion-button>
  </ion-toolbar>

</ion-header>


<ion-content class="ion-padding">
  <ion-list>
    <ion-item> 
      <ion-input label="Nombre de la Carrera* :" labelplacement="floating" [(ngModel)]="carrera.nombre" Type ="text" > </ion-input>
    </ion-item>



    <ion-item> 
      <ion-select label="Tipo* :" [(ngModel)]="carrera.tipo"> 
        @for (tipo of lista_tipos; track tipo) {
          <ion-select-option [value]="tipo">
            {{tipo}}
          </ion-select-option>
        }
      </ion-select>
    </ion-item>



  </ion-list>
  
  <ion-button expand="block" (click)="validarGuardar()"> 
    
    Guardar 

  </ion-button>


</ion-content>
